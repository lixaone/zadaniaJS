<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<title>Ile sekund - modyfikacja</title>
</head>
<body>
<div style="color:green;font-size:45px;">
<script language="JavaScript">
// Illia Romanovych 3f2 16.10.2026
// Zadanie 12
var D1_rom = prompt("D1=", "");
var G1_rom = prompt("G1=", "");
var D2_rom = prompt("D2=", "");
var G2_rom = prompt("G2=", "");
var d1 = parseFloat(D1_rom), g1 = parseFloat(G1_rom);
var d2 = parseFloat(D2_rom), g2 = parseFloat(G2_rom);
var sekund = (d1 - d2) * 24 * 60 * 60 + (g1 - g2) * 60 * 60;
document.write("Ilość sekund między " + d1 + " dniem godz. " + g1 + " a " + d2 + " dniem godz. " + g2 + " = " + sekund + " sekund<br>");
function okno_zamknij_romanovych() { window.close(); }
</script>
</div>
<input type="button" value="zamknij okno" onclick="okno_zamknij_romanovych()"/>
</body>
</html>
