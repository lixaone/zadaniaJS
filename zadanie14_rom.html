<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<title>Ułamek egipski na trzy</title>
</head>
<body>
<div style="color:navy;font-size:30px;">
<script language="JavaScript">
// Illia Romanovych 3f2 16.10.2026
// Zadanie 14
var m_rom = parseInt(prompt("m=", "4"));
// 1/m = 1/(m+1) + 1/(m(m+1)),  potem 1/(m+1) = 1/(m+2) + 1/((m+1)(m+2))
var a1 = m_rom + 2;
var a2 = (m_rom + 1) * (m_rom + 2);
var a3 = m_rom * (m_rom + 1);
document.write("1/" + m_rom + " = 1/" + a1 + " + 1/" + a2 + " + 1/" + a3 + "<br>");
function okno_zamknij_romanovych() { window.close(); }
</script>
</div>
<input type="button" value="zamknij okno" onclick="okno_zamknij_romanovych()"/>
</body>
</html>
