<body>

<h3>Confirm Box - teoria</h3>
<p><b>Zastosowanie:</b> Confirm Box jest używany, jeśli chcemy zapytać użytkownika o weryfikację lub akceptację jakichś danych. Użytkownik naciska OK w celu akceptacji bądź Cancel w celu odrzucenia. Jeżeli zostanie wybrane OK, metoda zwraca true, w przeciwnym wypadku false.</p>
<input type="button" onclick="show_confirm()" value="Pokaż confirm box" />
<div id="wynik" style="margin-top:10px"></div>
<br><input type="button" value="zamknij okno" onclick="okno_zamknij_romanovych()"/>
<script>
function show_confirm() {
  var r = confirm("Naciśnij klawisz");
  if (r == true) { document.getElementById("wynik").innerHTML = "Nacisnąłeś OK!"; }
  else { document.getElementById("wynik").innerHTML = "Nacisnąłeś Cancel!"; }
}
function okno_zamknij_romanovych() { window.close(); }
</script>

</body>
</html>
