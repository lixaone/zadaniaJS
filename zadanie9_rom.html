<!DOCTYPE html>

<meta charset="utf-8">

<body>

<h3>Prompt Box - teoria</h3>
<p><b>Zastosowanie:</b> Prompt Box jest używany, kiedy użytkownik ma wpisać coś, np. zanim wejdzie w dany moduł strony (np. hasło). Po wpisaniu wartości użytkownik może nacisnąć OK albo Cancel. Jeżeli kliknie OK, metoda zwraca wpisaną wartość, w przeciwnym wypadku zwraca null.</p>
<input type="button" onclick="show_prompt()" value="Pokaż prompt box" />
<div id="wynik" style="margin-top:10px"></div>
<br><input type="button" value="zamknij okno" onclick="okno_zamknij_romanovych()"/>
<script>
function show_prompt() {
  var name = prompt("Napisz imię", "Illia Romanovych");
  if (name != null && name != "") {
    document.getElementById("wynik").innerHTML = "Witaj " + name + "! jak się masz?";
  }
}
function okno_zamknij_romanovych() { window.close(); }
</script>

</body>
</html>
